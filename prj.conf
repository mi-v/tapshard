# TapShard BLE-HID TOTP token — application configuration

# --- Flash via SWD, no UF2 bootloader ---
CONFIG_BOARD_HAS_NRF5_BOOTLOADER=n

# --- GPIO (LED + button) ---
CONFIG_GPIO=y

# --- Battery monitoring via SAADC VDDH/5 ---
CONFIG_ADC=y
CONFIG_ADC_NRFX_SAADC=y
CONFIG_TOTP_BATTERY_MONITOR=y

# --- Bluetooth ---
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_SMP=y
CONFIG_BT_FILTER_ACCEPT_LIST=y
CONFIG_BT_DEVICE_NAME="TapShard TOTP token"
CONFIG_BT_DEVICE_APPEARANCE=961

# --- Bonding persistence (pairing survives reboot) ---
CONFIG_BT_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y

# --- Pairing: Just Works (no MITM/passkey) ---
CONFIG_BT_SMP_ENFORCE_MITM=n
# Allow re-pairing over a stale Just-Works bond (host forgot the device, but
# the device still has the old unauth bond). Without this, re-pairing fails
# with BT_SECURITY_ERR_AUTH_REQUIREMENT ("wrong pin").
CONFIG_BT_SMP_ALLOW_UNAUTH_OVERWRITE=y

# --- SWD button-emulation poll (debug; disabled by default, re-enable for bench
#     testing without a physical button) ---
CONFIG_TOTP_TEST_POLL=y

# --- Debug hooks: built-in test config + SWD reload (disable for production) ---
CONFIG_TOTP_DEBUG=y

# --- Allow re-pairing (bond replacement needs a free key slot) ---
CONFIG_TOTP_MAX_BONDS=4
CONFIG_BT_MAX_PAIRED=4

# --- More ATT/L2CAP TX buffers (HID reports burst; default 3 is too few,
#     and the notify path allocates non-blocking from the sys workqueue) ---
CONFIG_BT_BUF_ACL_TX_COUNT=32
CONFIG_BT_BUF_EVT_RX_COUNT=40
CONFIG_BT_ATT_TX_COUNT=32
CONFIG_BT_L2CAP_TX_BUF_COUNT=32

# --- Stack for settings API + FatFs config reading in workqueue ---
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=8192

# --- Power: use low-frequency crystal for BLE (board default is XTAL) ---
# (no override needed; LFXO is the default and is populated on this board)

# --- Crypto for TOTP (HMAC-SHA1 via PSA) ---
CONFIG_PSA_WANT_ALG_SHA_1=y
CONFIG_PSA_WANT_ALG_HMAC=y
CONFIG_PSA_WANT_KEY_TYPE_HMAC=y

# --- System heap (required by mbedtls/PSA crypto allocations) ---
CONFIG_HEAP_MEM_POOL_SIZE=32768

# --- Main thread stack (PSA crypto HMAC is stack-heavy) ---
CONFIG_MAIN_STACK_SIZE=8192

# --- USB Mass Storage (new usbd stack) for config ---
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_MSC_CLASS=y
CONFIG_DISK_DRIVER_RAM=y

# --- FAT file system (device reads the config) ---
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FILE_SYSTEM_MKFS=y
CONFIG_FS_FATFS_MKFS=y
# Long filenames so config.ini is stored with its lowercase name (short 8.3
# names are uppercase-only).
CONFIG_FS_FATFS_LFN=y
# Enable file timestamps; get_fattime() (config_fs.c) returns 1980-01-01 so
# device-written files never look like a valid clock anchor.
CONFIG_FS_FATFS_HAS_RTC=y

# --- Disable the board's default CDC-ACM serial backend ---
CONFIG_BOARD_SERIAL_BACKEND_CDC_ACM=n
CONFIG_USBD_CDC_ACM_CLASS=n
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
