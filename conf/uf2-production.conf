# Protected UF2 build for normal use; see docs/UF2.md for security boundaries.
CONFIG_TOTP_DEBUG=n
CONFIG_TOTP_TEST_POLL=n
CONFIG_TOTP_UF2_BENCH=n
CONFIG_TOTP_SECURITY_BOOTLOADER=y
CONFIG_NRF_APPROTECT_LOCK=y
CONFIG_SRAM_SIZE=255

# Normal battery handling and quiet tickless idle.
CONFIG_TOTP_BATTERY_MONITOR=y
CONFIG_TICKLESS_KERNEL=y
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_LOG=n
CONFIG_BOOT_BANNER=n
CONFIG_PRINTK=n
