# Current/battery measurements with the wiping bootloader left unlocked.
# Test secrets only; physical GPIO interrupts replace SWD button polling.
CONFIG_TOTP_UF2_BENCH=y
CONFIG_TOTP_SECURITY_BOOTLOADER=y
CONFIG_TOTP_DEBUG=n
CONFIG_TOTP_TEST_POLL=n
CONFIG_NRF_APPROTECT_USE_UICR=y
CONFIG_SRAM_SIZE=255

# Keep the normal battery sampler and tickless idle; disable output backends.
CONFIG_TOTP_BATTERY_MONITOR=y
CONFIG_TICKLESS_KERNEL=y
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_LOG=n
CONFIG_BOOT_BANNER=n
CONFIG_PRINTK=n
